version: 2
# Version-update PRs are disabled (limits set to 0) ahead of repository
# archival; Dependabot security updates are governed separately and stay on.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

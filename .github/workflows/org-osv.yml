name: org-osv

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  # `google/osv-scanner-action/scan-repo` does not exist — the action provides
  # `action.yml` at its root plus `osv-scanner-action/` and
  # `osv-reporter-action/`, so every run died before starting with
  # "Can't find 'action.yml' ... for action .../scan-repo".
  #
  # `fail-on-vuln` and `upload-sarif` are inputs of the REUSABLE WORKFLOW, not
  # of the action, so calling that is both the intended shape and the one
  # upstream recommends ("we recommend using the reusable workflows instead of
  # directly using the scanner action").
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c5996e0193a3df57d695c1b8a1dec2a4c62e8730
    with:
      fail-on-vuln: false
      upload-sarif: false

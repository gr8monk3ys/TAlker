[tool.poetry]
name = "talker"
version = "0.3.0"
description = "A Production-Grade Multi-Provider RAG Teaching Assistant"
authors = ["Lorenzo Scaturchio"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"

# Web Framework
streamlit = "^1.29.0"
streamlit-authenticator = "^0.3.1"

# Piazza Integration
piazza-api = "^0.15.0"

# Environment & Config
python-dotenv = "^1.0.0"
requests = "^2.32.4"

# LangChain Core (1.x line; the 0.3.x series has unpatched CVEs)
langchain = "^1.3.9"
langchain-classic = "^1.0.0"
langchain-core = ">=1.2.22"
langchain-text-splitters = ">=1.1.2"
langchain-community = "*"
langchain-chroma = "*"

# LLM Providers (SDKs come transitively via these integration packages)
langchain-openai = "^1.1.14"
langchain-anthropic = "^1.4.6"
langchain-google-genai = "*"
langchain-cohere = "*"
langchain-ollama = "*"
langchain-huggingface = "*"

# Vector Store
chromadb = "*"

# Hybrid Search & Reranking
sentence-transformers = "*"
transformers = ">=5.5.0"
rank-bm25 = "^0.2.2"

# Local Embeddings (optional, for offline use)
fastembed = {version = "*", optional = true}

# Document Processing
pypdf = "*"

# Security pins (transitive dependency minimums)
h11 = ">=0.16.0"
Jinja2 = ">=3.1.6"
pillow = ">=12.1.1"
protobuf = ">=5.29.6"
urllib3 = ">=2.6.3"
tornado = ">=6.5"
gitpython = ">=3.1.57"
cryptography = ">=50.0.0"
unstructured = "^0.18.18"

# Data & Visualization
pandas = "^2.1.4"
plotly = "^5.18.0"
wordcloud = "^1.9.3"
matplotlib = "^3.8.0"

[tool.poetry.extras]
local = ["fastembed"]

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^9.0.3"
pytest-cov = "*"
pytest-asyncio = "*"
pytest-mock = "^3.12.0"

# Code Quality
black = "^26.3.1"
pylint = "^3.0.3"
mypy = "^1.8.0"
ruff = "^0.4.0"

# Type Stubs
types-requests = "^2.31.0"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src --cov-report=term-missing"
asyncio_mode = "auto"

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "C0330",  # bad-continuation
    "C0326",  # bad-whitespace
]

[tool.pylint.format]
max-line-length = 88

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
